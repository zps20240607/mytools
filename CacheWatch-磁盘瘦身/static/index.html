<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CacheWatch · 磁盘瘦身</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/base.css">
</head>
<body>
<header>
  <div class="brand"><span class="logo">🗑</span> CacheWatch <span class="sub">磁盘瘦身</span><span class="seal">瘦身</span></div>
  <div class="stats" id="stats"></div>
  <div class="controls">
    <input id="search" type="text" placeholder="搜索路径…">
    <select id="kindFilter">
      <option value="">全部类型</option>
      <option value="node_modules">node_modules</option>
      <option value="pycache">Python 缓存</option>
      <option value="git">.git 历史</option>
      <option value="fixed">工具缓存</option>
      <option value="models">模型</option>
    </select>
    <label class="toggle"><input type="checkbox" id="dryRun" checked> 预览模式</label>
    <button id="rescan" class="btn">⟳ 重新扫描</button>
    <button id="cleanAll" class="btn danger">清理全部可清理项</button>
    <button id="rootsBtn" class="btn">扫描范围</button>
    <button id="themeBtn" class="btn" title="主题切换">🌓</button>
  </div>
</header>
<main>
  <div id="notice" class="notice"></div>
  <table id="table">
    <thead><tr><th>类型</th><th>路径</th><th style="text-align:right">占用</th><th style="text-align:right">文件数</th><th style="text-align:right">操作</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="empty" class="empty" hidden>扫描中…</div>
</main>
<footer id="footer"></footer>

<div id="modalRoots" class="modal" hidden>
  <div class="modal-box">
    <h3>扫描根目录</h3>
    <ul id="rootsList" class="roots"></ul>
    <div class="row"><input id="newRoot" type="text" placeholder="例如 D:\code"><button id="addRoot" class="btn">添加</button></div>
    <div class="row end"><button id="closeRoots" class="btn ghost">关闭</button></div>
  </div>
</div>

<div id="modalClean" class="modal" hidden>
  <div class="modal-box">
    <h3 id="cleanTitle">清理</h3>
    <div id="cleanLog" class="log">等待执行…</div>
    <div class="row end">
      <button id="closeClean" class="btn ghost">关闭</button>
      <button id="runClean" class="btn danger">确认执行</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<script src="/static/theme.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
